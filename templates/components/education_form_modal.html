<div id="education-form-modal"
     class="education-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="education-form-modal-title">
    <button type="button"
            class="education-form-modal__backdrop"
            popovertarget="education-form-modal"
            popovertargetaction="hide"
            aria-label="Tutup form pendidikan"></button>
    <div class="education-form-modal__content">
        <button type="button"
                class="education-form-modal__close"
                popovertarget="education-form-modal"
                popovertargetaction="hide"
                aria-label="Tutup form pendidikan">×</button>
        <h2 id="education-form-modal-title">Data Pendidikan</h2>
        <form id="education-form"
              method="post"
              action="{% url 'api:education-list' %}"
              class="education-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="education-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="education-form-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan</button>
            </div>
        </form>
    </div>
</div>
