{% extends "base.html" %}
{% block title %}Update Education - {{ name }}{% endblock title %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1>Ubah Pendidikan</h1>
                <form method="post"
                      action="{% url 'main:update_education' education.id %}"
                      class="education-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">Simpan Perubahan</button>
                    <a href="{% url 'main:show_education' %}" class="button button-secondary">Batal</a>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
